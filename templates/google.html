<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gmial Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fa;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-card{
    width:900px;
    max-width:90%;
    background:white;
    border-radius:25px;
    padding:50px;
    display:flex;
    justify-content:space-between;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.left{
    width:40%;
}

.brand{
    font-size:50px;
    font-weight:bold;
    color:#2563eb;
    margin-bottom:25px;
}

.left h1{
    font-size:42px;
    margin-bottom:10px;
}

.left p{
    color:#555;
}

.right{
    width:50%;
}

.input-group{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #d0d0d0;
    border-radius:8px;
    font-size:16px;
}

input:focus{
    outline:none;
    border-color:#2563eb;
}

a{
    color:#2563eb;
    text-decoration:none;
}

.info{
    margin-top:35px;
    color:#666;
    line-height:1.6;
}

.bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:50px;
}

.btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:25px;
    cursor:pointer;
    font-size:16px;
}

.btn:hover{
    background:#1d4ed8;
}

@media(max-width:768px){
    .login-card{
        flex-direction:column;
        gap:30px;
    }

    .left,
    .right{
        width:100%;
    }
}
</style>
</head>
<body>

<div class="login-card">

    <div class="left">
        <div class="brand">Gmial</div>

        <h1>Sign in</h1>
        <p>to continue to Gmial</p>
    </div>

    <div class="right">

        <div class="input-group">
            <input type="email" placeholder="Email or phone">
        </div>

        <a href="#">Forgot email?</a>

        <div class="info">
            Not your computer? Use a guest session to sign in privately.
        </div>

        <div class="bottom">
            <a href="#">Create account</a>
            <button class="btn">Next</button>
        </div>

    </div>

</div>

</body>
</html>
